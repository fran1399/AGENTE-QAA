<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-label="Los ocho agentes de AGENTE-QAA">
  <title>El equipo multiagente de AGENTE-QAA</title>
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1425"/>
      <stop offset="1" stop-color="#0d1a33"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="gGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#213a60" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="url(#gBg)"/>
  <rect x="0" y="0" width="1240" height="760" fill="url(#gGrid)"/>
  <rect x="0" y="0" width="1240" height="6" fill="url(#gAccent)"/>

  <text x="42" y="62" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#e8f1ff">El equipo multiagente</text>
  <text x="42" y="90" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8aa6cb">Un QA Lead primario que orquesta y siete especialistas · perfiles reales en .opencode/agents/ · mínimo privilegio por agente</text>

  <!-- CARD 1 · QA Lead -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="42" y="150" width="270" height="240" rx="16" fill="#16294a" stroke="#2f5c96"/>
    <rect x="64" y="172" width="52" height="52" rx="14" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="290" y="194" text-anchor="end" font-size="24" font-weight="800" fill="#38bdf8" fill-opacity="0.22">01</text>
    <g transform="translate(90,198)" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round">
      <line x1="0" y1="0" x2="14" y2="0"/><line x1="0" y1="0" x2="-14" y2="0"/><line x1="0" y1="0" x2="0" y2="14"/><line x1="0" y1="0" x2="0" y2="-14"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8" stroke="none"/>
      <circle cx="14" cy="0" r="3.5" fill="#0e1a30"/><circle cx="-14" cy="0" r="3.5" fill="#0e1a30"/><circle cx="0" cy="14" r="3.5" fill="#0e1a30"/><circle cx="0" cy="-14" r="3.5" fill="#0e1a30"/>
    </g>
    <text x="64" y="256" font-size="15.5" font-weight="700" fill="#eaf3ff">QA Lead</text>
    <text x="64" y="278" font-size="11" font-weight="600" fill="#7dd3fc">Orquestación y decisión final</text>
    <text x="64" y="306" font-size="10.5" fill="#9db6d8">Delega en los siete especialistas,</text>
    <text x="64" y="324" font-size="10.5" fill="#9db6d8">aplica el flujo y consolida el resultado.</text>
  </g>

  <!-- CARD 2 · Test Designer -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="337" y="150" width="270" height="240" rx="16" fill="#16294a" stroke="#2f5c96"/>
    <rect x="359" y="172" width="52" height="52" rx="14" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="585" y="194" text-anchor="end" font-size="24" font-weight="800" fill="#a78bfa" fill-opacity="0.22">02</text>
    <g transform="translate(385,198)" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-14" y="-17" width="28" height="34" rx="4"/>
      <line x1="-8" y1="-7" x2="8" y2="-7"/><line x1="-8" y1="1" x2="8" y2="1"/>
      <path d="M-8 10 L-3 15 L8 4"/>
    </g>
    <text x="359" y="256" font-size="15.5" font-weight="700" fill="#eaf3ff">Test Designer</text>
    <text x="359" y="278" font-size="11" font-weight="600" fill="#c4b5fd">Diseño de pruebas</text>
    <text x="359" y="306" font-size="10.5" fill="#9db6d8">Casos positivos, negativos, borde y</text>
    <text x="359" y="324" font-size="10.5" fill="#9db6d8">regresión, con trazabilidad y prioridad.</text>
  </g>

  <!-- CARD 3 · Risk Analyst -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="632" y="150" width="270" height="240" rx="16" fill="#16294a" stroke="#2f5c96"/>
    <rect x="654" y="172" width="52" height="52" rx="14" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="880" y="194" text-anchor="end" font-size="24" font-weight="800" fill="#f59e0b" fill-opacity="0.22">03</text>
    <g transform="translate(680,198)" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -17 L17 13 L-17 13 Z"/>
      <line x1="0" y1="-5" x2="0" y2="4"/>
      <circle cx="0" cy="9" r="1.6" fill="#f59e0b" stroke="none"/>
    </g>
    <text x="654" y="256" font-size="15.5" font-weight="700" fill="#eaf3ff">Risk Analyst</text>
    <text x="654" y="278" font-size="11" font-weight="600" fill="#fcd9a0">Análisis y priorización de riesgo</text>
    <text x="654" y="306" font-size="10.5" fill="#9db6d8">Identifica y prioriza riesgos; define</text>
    <text x="654" y="324" font-size="10.5" fill="#9db6d8">la validación exigida según la matriz.</text>
  </g>

  <!-- CARD 4 · Exploratory QA -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="927" y="150" width="270" height="240" rx="16" fill="#16294a" stroke="#2f5c96"/>
    <rect x="949" y="172" width="52" height="52" rx="14" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="1175" y="194" text-anchor="end" font-size="24" font-weight="800" fill="#22d3ee" fill-opacity="0.22">04</text>
    <g transform="translate(975,198)" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round">
      <circle cx="-3" cy="-3" r="11"/>
      <line x1="5" y1="5" x2="15" y2="15"/>
    </g>
    <text x="949" y="256" font-size="15.5" font-weight="700" fill="#eaf3ff">Exploratory QA</text>
    <text x="949" y="278" font-size="11" font-weight="600" fill="#a5ecf7">Exploración guiada por riesgo</text>
    <text x="949" y="306" font-size="10.5" fill="#9db6d8">Separa observación, hipótesis,</text>
    <text x="949" y="324" font-size="10.5" fill="#9db6d8">evidencia y conclusión.</text>
  </g>

  <!-- CARD 5 · Test Data -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="42" y="415" width="270" height="240" rx="16" fill="#16294a" stroke="#2f5c96"/>
    <rect x="64" y="437" width="52" height="52" rx="14" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="290" y="459" text-anchor="end" font-size="24" font-weight="800" fill="#34d399" fill-opacity="0.22">05</text>
    <g transform="translate(90,463)" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round">
      <ellipse cx="0" cy="-12" rx="13" ry="5"/>
      <line x1="-13" y1="-12" x2="-13" y2="9"/>
      <line x1="13" y1="-12" x2="13" y2="9"/>
      <path d="M-13 -3 A 13 5 0 0 0 13 -3"/>
      <path d="M-13 9 A 13 5 0 0 0 13 9"/>
    </g>
    <text x="64" y="521" font-size="15.5" font-weight="700" fill="#eaf3ff">Test Data</text>
    <text x="64" y="543" font-size="11" font-weight="600" fill="#a7e8c9">Datos de prueba y trazabilidad</text>
    <text x="64" y="571" font-size="10.5" fill="#9db6d8">Identifica y valida Test Data; sin</text>
    <text x="64" y="589" font-size="10.5" fill="#9db6d8">datos válidos el caso queda BLOCKED.</text>
  </g>

  <!-- CARD 6 · Test Executor -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="337" y="415" width="270" height="240" rx="16" fill="#16294a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="359" y="437" width="52" height="52" rx="14" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.55"/>
    <text x="585" y="459" text-anchor="end" font-size="24" font-weight="800" fill="#3b82f6" fill-opacity="0.25">06</text>
    <g transform="translate(385,463)" fill="none" stroke="#7cb0ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="16"/>
      <path d="M-6 -9 L-6 9 L9 0 Z" fill="#7cb0ff" stroke="none"/>
    </g>
    <text x="359" y="521" font-size="15.5" font-weight="700" fill="#eaf3ff">Test Executor</text>
    <text x="359" y="543" font-size="11" font-weight="600" fill="#9cc3ff">Ejecución y evidencia verificable</text>
    <text x="359" y="571" font-size="10.5" fill="#9db6d8">Único agente que ejecuta; corre</text>
    <text x="359" y="589" font-size="10.5" fill="#9db6d8">Pre-flight y captura evidencia real.</text>
  </g>

  <!-- CARD 7 · Bug Analyst -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="632" y="415" width="270" height="240" rx="16" fill="#16294a" stroke="#2f5c96"/>
    <rect x="654" y="437" width="52" height="52" rx="14" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.5"/>
    <text x="880" y="459" text-anchor="end" font-size="24" font-weight="800" fill="#f87171" fill-opacity="0.22">07</text>
    <g transform="translate(680,463)" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="0" cy="1" rx="11" ry="13"/>
      <circle cx="0" cy="-15" r="4"/>
      <line x1="0" y1="-11" x2="0" y2="13"/>
      <line x1="-11" y1="-6" x2="-19" y2="-12"/><line x1="11" y1="-6" x2="19" y2="-12"/>
      <line x1="-11" y1="2" x2="-20" y2="2"/><line x1="11" y1="2" x2="20" y2="2"/>
      <line x1="-11" y1="9" x2="-18" y2="15"/><line x1="11" y1="9" x2="18" y2="15"/>
      <line x1="-4" y1="-18" x2="-8" y2="-23"/><line x1="4" y1="-18" x2="8" y2="-23"/>
    </g>
    <text x="654" y="521" font-size="15.5" font-weight="700" fill="#eaf3ff">Bug Analyst</text>
    <text x="654" y="543" font-size="11" font-weight="600" fill="#f7b1b1">Clasificación de fallos</text>
    <text x="654" y="571" font-size="10.5" fill="#9db6d8">Clasifica cada FAIL antes de confirmar</text>
    <text x="654" y="589" font-size="10.5" fill="#9db6d8">un Bug (APP_BUG, TEST_DATA, ...).</text>
  </g>

  <!-- CARD 8 · QA Reviewer -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="927" y="415" width="270" height="240" rx="16" fill="#16294a" stroke="#2f5c96"/>
    <rect x="949" y="437" width="52" height="52" rx="14" fill="#facc15" fill-opacity="0.14" stroke="#facc15" stroke-opacity="0.5"/>
    <text x="1175" y="459" text-anchor="end" font-size="24" font-weight="800" fill="#facc15" fill-opacity="0.22">08</text>
    <g transform="translate(975,463)" fill="none" stroke="#facc15" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -18 L15 -12 V 2 C 15 11 7 16 0 19 C -7 16 -15 11 -15 2 V -12 Z"/>
      <path d="M-7 -1 L-2 5 L 8 -6"/>
    </g>
    <text x="949" y="521" font-size="15.5" font-weight="700" fill="#eaf3ff">QA Reviewer</text>
    <text x="949" y="543" font-size="11" font-weight="600" fill="#f6dd8a">Revisión independiente</text>
    <text x="949" y="571" font-size="10.5" fill="#9db6d8">Auditor que desafía conclusiones y</text>
    <text x="949" y="589" font-size="10.5" fill="#9db6d8">exige evidencia suficiente.</text>
  </g>

  <line x1="42" y1="688" x2="1197" y2="688" stroke="#213a60" stroke-width="1"/>
  <text x="42" y="712" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#5f7ba0">Modelos y permisos se definen por agente en .opencode/agents/*.md · los subagentes no delegan (task: deny) · solo QA Lead es primario</text>
</svg>
